name: Release

# Packs the bundle into an installable .zip and publishes it, once per push to
# main. CI runs first and a red CI never publishes.
#
# Archive layout: every shipped file at the archive root, manifest.json
# included -- one of the two shapes MODS > Import mod .zip accepts. upstream/
# and maintained/ are excluded: they are the sources modules/ was built from,
# and shipping both would double the download for no gain.
#
# Versioning, first rule that applies wins:
#   1. the "version" input of a manual run,
#   2. "[release X.Y.Z]" anywhere in the commit message,
#   3. manifest.json's own version, when it is ahead of every existing tag.
# If none apply the run stops after CI without publishing.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'docs/**'
      - 'mod.card'
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release (e.g. 1.0.1). Blank to auto-resolve."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Determine version
        id: ver
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys

          SEMVER = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True).stdout.strip()

          def parse(text):
              m = SEMVER.match(text)
              return tuple(int(p) for p in m.groups()) if m else None

          def die(msg):
              print(f"::error::{msg}", file=sys.stderr)
              raise SystemExit(1)

          with open("manifest.json", encoding="utf-8") as fh:
              manifest_version = str(json.load(fh).get("version", ""))

          released = sorted(
              v for v in (parse(tag[1:]) for tag in sh("git", "tag", "-l", "v*").splitlines()) if v
          )
          latest = released[-1] if released else None

          override = os.environ.get("DISPATCH_VERSION", "").strip()
          if not override:
              found = re.search(r"\[release\s+(\d+\.\d+\.\d+)\]", sh("git", "log", "-1", "--pretty=%B"))
              override = found.group(1) if found else ""

          manifest_ver = parse(manifest_version)
          if not manifest_ver and not override:
              die(f"manifest.json version {manifest_version!r} is not X.Y.Z")

          if override:
              version = parse(override) or die(f"invalid version override {override!r}")
              source = "the override"
          elif latest is None or manifest_ver > latest:
              version = manifest_ver
              source = "manifest.json"
          else:
              print(f"manifest.json is at {manifest_version} and v%d.%d.%d is "
                    "already released; nothing to publish." % latest, file=sys.stderr)
              print("release=false")
              raise SystemExit(0)

          text = "%d.%d.%d" % version
          print(f"Releasing {text}, from {source}.", file=sys.stderr)
          print("release=true")
          print(f"version={text}")
          print(f"tag=v{text}")
          PY

      - name: Refuse to clobber an existing release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Pick a different version."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Pick a different version."
            exit 1
          fi

      - name: Build the mod .zip
        if: steps.ver.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MOD_ID: "gen1_wild_ui"
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/pkg"
          out="$GITHUB_WORKSPACE/dist"
          rm -rf "$staging" "$out"
          mkdir -p "$staging" "$out"

          # modules/ is committed, so git archive carries it. upstream/ is a
          # submodule and git archive skips it, which is what we want.
          git archive HEAD | tar -x -C "$staging"

          rm -rf "$staging/.github" "$staging/.gitignore" \
                 "$staging/.gitmodules" "$staging/tools" \
                 "$staging/tests" "$staging/overlays" \
                 "$staging/upstream" "$staging/maintained"

          python3 - "$staging/manifest.json" "$VERSION" <<'PY'
          import json, sys
          path, version = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              manifest = json.load(fh)
          manifest["version"] = version
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY

          test -f "$staging/main.lua"      || { echo "::error::main.lua missing"; exit 1; }
          test -f "$staging/features.lua"  || { echo "::error::features.lua missing"; exit 1; }
          test -d "$staging/modules"       || { echo "::error::modules/ missing"; exit 1; }
          test -d "$staging/runtime"       || { echo "::error::runtime/ missing"; exit 1; }

          zip_path="$out/${MOD_ID}-${VERSION}.zip"
          (cd "$staging" && zip -qr "$zip_path" .)
          unzip -l "$zip_path" | tail -5

          unzip -p "$zip_path" manifest.json > "$RUNNER_TEMP/packed-manifest.json"
          python3 - "$RUNNER_TEMP/packed-manifest.json" "$VERSION" <<'PY'
          import json, sys
          path, expected = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              version = json.load(fh)["version"]
          if version != expected:
              raise SystemExit(f"::error::packed manifest says {version}, expected {expected}")
          print(f"manifest.json is at the archive root and reports {version}")
          PY

          (cd "$out" && sha256sum "${MOD_ID}"-*.zip > sha256sums.txt)
          cat "$out/sha256sums.txt"

      - name: Publish GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          MOD_ID: "gen1_wild_ui"
        run: |
          set -euo pipefail

          prev="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
          range="${prev:+${prev}..}$GITHUB_SHA"
          changes="$(git log --no-merges --pretty='- %s' "$range" | head -50 || true)"

          notes=$'Download the .zip and install it from the game: MODS > Import mod .zip.'
          notes+=$'\n\nUninstall the standalone versions of the mods this bundles first -- they install the same hooks.'
          if [ -n "$changes" ]; then
            notes+=$'\n\n## Changes\n\n'"$changes"
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "$notes" \
            "dist/${MOD_ID}-${VERSION}.zip" \
            "dist/sha256sums.txt"

          echo "Published release $TAG"

      - name: Note that nothing was released
        if: steps.ver.outputs.release != 'true'
        run: |
          set -euo pipefail
          {
            echo "### No release cut"
            echo
            echo "\`manifest.json\` is not ahead of the newest tag, so this push"
            echo "was checked but not published."
          } >> "$GITHUB_STEP_SUMMARY"
