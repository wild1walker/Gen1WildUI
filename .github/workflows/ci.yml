name: CI

# Everything that has to be true before this bundle is worth releasing.
#
# There is no `modkit gen2check` step, and its absence is deliberate. This
# bundle is Gen 1: it carries mods that are Gen 1 only -- Gen151 and
# Gen1AutoContinue here, Gen1Arena, Gen1Dex, Gen1BillsBox, Gen1ModernBag and
# Gen1Party in the other half -- so its manifest declares games: ["gen1"] and
# a Gen 2 boot skips it. gen2check reports on what a mod *would* hit if it
# claimed Gen 2, and fails a mod that has not, which is why every Gen 1-only
# mod in this suite omits the step: Gen1Arena runs no CI workflow at all and
# Gen151's lists every other check but this one. Gen1Sprint keeps it because
# Gen1Sprint really is games: ["all"] and really is clean on Gold.
#
# The interesting check is `build.py --check`: modules/ is committed (a mod is
# installed by copying a folder, and nothing runs a build), so it can drift
# from the submodules it was generated from. This rebuilds it and fails if the
# result differs, which makes that drift impossible to commit.

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ENGINE_REPO: ${{ vars.ENGINE_REPO || 'bryanthaboi/gen1recomp' }}
  ENGINE_REF: ${{ vars.ENGINE_REF || 'dev' }}
  MOD_ID: gen1_wild_ui

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the bundle
        uses: actions/checkout@v4
        with:
          path: mod
          submodules: recursive

      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit

      - name: modules/ is what the submodules build
        working-directory: mod
        run: python3 tools/build.py --check

      - name: Bundle checks
        working-directory: mod
        run: python3 tools/check.py

      - name: Bundle test suites
        working-directory: mod
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(tests/*.lua)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no test suite under tests/"
            exit 1
          fi
          # Every file, so adding a suite does not require editing this job.
          for suite in "${suites[@]}"; do
            echo "--- $suite"
            luajit "$suite"
          done

      - name: Checkout the engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: engine

      - name: Place the bundle in the engine tree
        run: |
          set -euo pipefail
          rm -rf "engine/mods/$MOD_ID"
          mkdir -p "engine/mods/$MOD_ID"
          # Only what ships. upstream/ and maintained/ are the sources
          # modules/ was built from; the engine reads modules/.
          (cd mod && tar -c \
             --exclude=.git --exclude=upstream --exclude=maintained \
             --exclude=.github --exclude=tools --exclude=tests \
             --exclude=overlays .) \
            | tar -x -C "engine/mods/$MOD_ID"

      - name: modkit validate
        working-directory: engine
        run: python3 tools/modkit.py validate "$MOD_ID"

      - name: modkit lint
        working-directory: engine
        run: python3 tools/modkit.py lint "$MOD_ID"

      - name: Vendored mods' own test suites
        working-directory: engine
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Each vendored mod keeps its tests in its own repository, where its
          # own CI runs them. They are run here too, against the submodule
          # checkout, so a sync that pins a broken upstream fails here rather
          # than in somebody's save file.
          # Each vendored mod's own tests, run the way that mod's own CI runs
          # them: staged at mods/<its own id>, not read out of the bundle's
          # tree. They are written against their own repository's layout --
          # some load their subject by that path, some require tests.modkit
          # off the engine's package path, some want their own directory --
          # and run from anywhere else they fail on something that says
          # nothing about the mod. This step used to do exactly that and its
          # warnings were noise.
          #
          # Gen151's placements and roll suites still warn: they want the pret
          # disassembly fixtures its own CI checks out beside the engine.
          pass=0; failed=0
          for dir in ../mod/upstream/*/; do
            manifest="$(find "$dir" -maxdepth 2 -name manifest.json | head -1)"
            [ -n "$manifest" ] || continue
            suites=("$dir"tests/*.lua)
            [ ${#suites[@]} -gt 0 ] || continue
            id="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$manifest")"
            rm -rf "mods/$id"; mkdir -p "mods/$id"
            (cd "$(dirname "$manifest")" && tar -c --exclude=.git .) | tar -x -C "mods/$id"
            for suite in "${suites[@]}"; do
              name="$(basename "$suite")"
              echo "--- $id/$name"
              if luajit "mods/$id/tests/$name" \
                 || ( cd "mods/$id/tests" && luajit "$name" ); then
                pass=$((pass + 1))
              else
                failed=$((failed + 1))
                echo "::warning::$id/$name failed against this engine revision"
              fi
            done
          done
          echo "ran $pass upstream suites, $failed failing"
